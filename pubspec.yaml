name: azmiu_app
description: "AZMİU Tələbə Kabineti"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & İkonlar
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  glassmorphism: ^3.0.0
  font_awesome_flutter: ^10.6.0
  
  # Storage & Network
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  
  # HTML Parser & WebView
  html: ^0.15.4
  webview_flutter: ^4.14.1
  local_auth: ^2.3.0
  
  url_launcher: ^6.2.2
  intl: ^0.19.0
  image_picker: ^1.0.7

  # Fayl Yükləmə və Sürüşdürmə
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  open_file: ^3.3.2
  flutter_slidable: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/